<section class="signup" id="newsletter">
  <h2 class="section">Newsletter</h2>
  <div class="signup-body">
    <p class="pitch">Get an email when there&rsquo;s something to hear, see or order.</p>
    <p class="small">Occasional, no spam, unsubscribe any time.</p>
    {%- comment -%} Campaign Monitor, the Coded Machines list. {%- endcomment %}
    <form id="subForm" class="js-cm-form" action="https://www.createsend.com/t/subscribeerror?description=" method="post" data-id="191722FC90141D02184CB1B62AB3DC26069ABE568AF5040CC0FC4D2F1EBD3091C81CED9EA0261713C10D5C9873BBF9A217516A9EA26F082D61DC0E278F27F77E">
      <div class="field">
        <label for="newsletter-name">Name</label>
        <input id="newsletter-name" name="cm-name" type="text" placeholder="Your name" maxlength="200" autocomplete="name">
      </div>
      <div class="field">
        <label for="newsletter-email">Email</label>
        <input id="newsletter-email" class="js-cm-email-input" name="cm-tdkyvt-tdkyvt" type="email" placeholder="you@example.com" maxlength="200" autocomplete="email" required>
      </div>
      <button class="js-cm-submit-button" type="submit">Subscribe</button>
    </form>
  </div>
</section>
<script src="https://js.createsend1.com/javascript/copypastesubscribeformlogic.js" defer></script>
